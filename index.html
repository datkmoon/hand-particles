<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Particle Universe — 3D Hand Control</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap');
    :root{--accent:#00ffcc;--bg:#050508;--panel:rgba(6,9,18,0.88);--border:rgba(0,255,204,0.15);--text:#ddf5ef;--muted:#5a8070;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);cursor:none;}

    /* cursor */
    #cur{position:fixed;width:10px;height:10px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:screen;transition:width .15s,height .15s;}
    #cur-ring{position:fixed;width:32px;height:32px;border:1.5px solid var(--accent);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);opacity:.4;transition:all .1s ease;}

    #canvas-container{position:fixed;inset:0;z-index:1;}

    /* webcam */
    #webcam{position:fixed;bottom:20px;right:20px;width:160px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--border);transform:scaleX(-1);z-index:20;background:#000;box-shadow:0 0 20px rgba(0,255,204,.1);}
    #wcam-lbl{position:fixed;bottom:146px;right:20px;z-index:20;font-size:9px;letter-spacing:2px;font-family:'Orbitron',sans-serif;color:var(--muted);}

    /* panel */
    .panel{position:fixed;top:20px;left:20px;z-index:20;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:22px 20px;border-radius:18px;border:1px solid var(--border);width:278px;box-shadow:0 0 60px rgba(0,255,204,.04),0 20px 50px rgba(0,0,0,.55);max-height:calc(100vh - 40px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
    .panel::-webkit-scrollbar{width:4px;}
    .panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

    .p-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
    .p-sub{font-size:10px;color:var(--muted);margin-bottom:20px;}
    .sec{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-family:'Orbitron',sans-serif;margin-bottom:8px;}
    .sep{height:1px;background:rgba(255,255,255,.05);margin:16px 0;}

    /* shape grid */
    .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px;}
    .sbtn{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:10px 4px 8px;cursor:none;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .2s;color:var(--muted);font-size:9px;text-align:center;position:relative;overflow:hidden;}
    .sbtn:hover{border-color:rgba(0,255,204,.25);color:var(--text);transform:translateY(-1px);}
    .sbtn.active{background:rgba(0,255,204,.09);border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(0,255,204,.15);}
    .sbtn span.ico{font-size:20px;}

    /* color row */
    .crow{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
    .swatches{display:flex;gap:6px;flex:1;}
    .sw{width:22px;height:22px;border-radius:50%;cursor:none;border:2px solid transparent;transition:all .2s;flex-shrink:0;}
    .sw:hover,.sw.on{border-color:#fff;transform:scale(1.2);}
    .cpick{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);overflow:hidden;position:relative;cursor:none;}
    .cpick:hover{border-color:var(--accent);}
    .cpick input{position:absolute;inset:-4px;width:200%;height:200%;opacity:0;cursor:none;}
    .cpick-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;pointer-events:none;}

    /* slider */
    .slrow{margin-bottom:14px;}
    .slhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .slval{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--accent);}
    input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:rgba(255,255,255,.1);border-radius:2px;outline:none;cursor:none;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:none;box-shadow:0 0 8px rgba(0,255,204,.45);}

    /* toggle */
    .trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .tlbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-family:'Orbitron',sans-serif;}
    .tog{width:36px;height:18px;background:rgba(255,255,255,.07);border-radius:9px;position:relative;cursor:none;border:1px solid rgba(255,255,255,.1);transition:background .3s;}
    .tog.on{background:rgba(0,255,204,.22);border-color:var(--accent);}
    .tog::after{content:'';position:absolute;width:12px;height:12px;background:var(--muted);border-radius:50%;top:2px;left:2px;transition:transform .3s,background .3s;}
    .tog.on::after{transform:translateX(18px);background:var(--accent);}

    /* 3D upload section */
    .upload-zone{border:1.5px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:none;transition:all .25s;margin-bottom:10px;position:relative;overflow:hidden;}
    .upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(0,255,204,.04);}
    .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .uz-ico{font-size:24px;margin-bottom:6px;}
    .uz-txt{font-size:10px;color:var(--muted);line-height:1.5;}
    .uz-txt strong{color:var(--text);display:block;margin-bottom:2px;}

    .model-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
    .model-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:9px;cursor:none;transition:all .2s;font-size:11px;}
    .model-item:hover{border-color:rgba(0,255,204,.25);background:rgba(0,255,204,.04);}
    .model-item.active{border-color:var(--accent);background:rgba(0,255,204,.08);color:var(--accent);}
    .model-item .mi-ico{font-size:16px;flex-shrink:0;}
    .model-item .mi-name{flex:1;color:var(--text);font-size:10px;}
    .model-item .mi-del{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);border:1px solid transparent;cursor:none;}
    .model-item .mi-del:hover{border-color:rgba(255,100,100,.4);color:#ff6b6b;}

    /* status */
    .status{font-size:11px;padding:10px 12px;background:rgba(255,255,255,.02);border-radius:9px;border-left:3px solid rgba(255,255,255,.15);line-height:1.6;color:var(--muted);transition:border-color .4s,color .4s;}
    .status.on{border-left-color:var(--accent);color:var(--text);}

    /* top-right */
    .tr{position:fixed;top:20px;right:20px;z-index:20;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
    .ibtn{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--muted);width:42px;height:42px;border-radius:11px;cursor:none;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,.4);}
    .ibtn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(0,255,204,.15);}

    #fps{position:fixed;bottom:20px;left:20px;z-index:20;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--muted);letter-spacing:2px;}

    /* loading */
    #loading{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
    #loading.fade{opacity:0;pointer-events:none;transition:opacity .7s ease;}
    .ltitle{font-family:'Orbitron',sans-serif;font-size:clamp(16px,3.5vw,28px);font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,var(--accent),#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .lbar-wrap{width:200px;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
    .lbar{height:100%;background:linear-gradient(90deg,var(--accent),#00aaff);border-radius:2px;width:0%;transition:width .4s ease;box-shadow:0 0 10px rgba(0,255,204,.4);}
    .lmsg{font-size:10px;color:var(--muted);letter-spacing:2px;font-family:'Orbitron',sans-serif;}

    /* toast */
    #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);z-index:300;background:rgba(0,255,204,.12);border:1px solid var(--accent);border-radius:10px;padding:10px 20px;font-size:12px;color:var(--accent);font-family:'Orbitron',sans-serif;letter-spacing:1px;opacity:0;transition:all .3s;pointer-events:none;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="cur"></div>
  <div id="cur-ring"></div>

  <div id="loading">
    <div class="ltitle">PARTICLE UNIVERSE</div>
    <div class="lbar-wrap"><div class="lbar" id="lbar"></div></div>
    <div class="lmsg" id="lmsg">INITIALIZING...</div>
  </div>

  <div id="toast"></div>
  <div id="canvas-container"></div>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="wcam-lbl">LIVE CAM</div>

  <div class="panel" id="panel">
    <div class="p-title">Particle Universe</div>
    <div class="p-sub">Hand gesture · 3D control</div>

    <!-- Built-in shapes -->
    <div class="sec">Built-in Shapes</div>
    <div class="sgrid" id="sgrid">
      <button class="sbtn active" data-model="tree"><span class="ico">🌲</span><span>Tree</span></button>
      <button class="sbtn" data-model="saturn"><span class="ico">🪐</span><span>Saturn</span></button>
      <button class="sbtn" data-model="heart"><span class="ico">❤️</span><span>Heart</span></button>
      <button class="sbtn" data-model="sphere"><span class="ico">🔮</span><span>Sphere</span></button>
      <button class="sbtn" data-model="torus"><span class="ico">⭕</span><span>Torus</span></button>
      <button class="sbtn" data-model="galaxy"><span class="ico">🌀</span><span>Galaxy</span></button>

    <!-- 3D model upload -->

    <div class="upload-zone" id="upload-zone">

      </div>

    <!-- Custom model list -->
    <div class="model-list" id="model-list"></div>

    <div class="sep"></div>

    <!-- Color -->
    <div class="sec">Particle Color</div>
    <div class="crow">
      <div class="swatches" id="swatches">
        <div class="sw on" style="background:#00ffcc" data-c="#00ffcc"></div>
        <div class="sw" style="background:#ff6b6b" data-c="#ff6b6b"></div>
        <div class="sw" style="background:#7c6cff" data-c="#7c6cff"></div>
        <div class="sw" style="background:#ffd93d" data-c="#ffd93d"></div>
        <div class="sw" style="background:#ff8c69" data-c="#ff8c69"></div>
        <div class="sw" style="background:#ffffff" data-c="#ffffff"></div>
      </div>
      <div class="cpick"><input type="color" id="pcolor" value="#00ffcc"/><div class="cpick-ico">🎨</div></div>
    </div>

    <!-- Size slider -->
    <div class="slrow">
      <div class="slhdr"><span class="sec" style="margin:0">Particle Size</span><span class="slval" id="szval">0.34</span></div>
      <input type="range" id="sz" min="0.06" max="1.2" step="0.02" value="0.34"/>
    </div>

    <!-- Count slider -->
    <div class="slrow">
      <div class="slhdr"><span class="sec" style="margin:0">Density</span><span class="slval" id="densval">40k</span></div>
      <input type="range" id="dens" min="1" max="4" step="1" value="2"/>

    <!-- Speed slider -->
    <div class="slrow">
      <div class="slhdr"><span class="sec" style="margin:0">Morph Speed</span><span class="slval" id="spval">0.075</span></div>
      <input type="range" id="sp" min="0.01" max="0.25" step="0.005" value="0.075"/>
    </div>

    <!-- Toggles -->
    <div class="trow"><span class="tlbl">Auto Rotate</span><div class="tog on" id="tog-rot"></div></div>
    <div class="trow"><span class="tlbl">Fog Effect</span><div class="tog on" id="tog-fog"></div></div>

    <div class="sep"></div>
    <div class="status" id="gstatus">Particles loading…</div>
  </div>

  <!-- Top right -->
  <div class="tr">
    <button class="ibtn" id="btn-fs" title="Fullscreen">⛶</button>
    <button class="ibtn" id="btn-ss" title="Screenshot">📷</button>
    <button class="ibtn" id="btn-panel" title="Hide panel">◀</button>
  </div>

  <div id="fps">-- FPS</div>

<script>
// ── cursor ────────────────────────────────────────────────
const cur=document.getElementById('cur'),curR=document.getElementById('cur-ring');
document.addEventListener('mousemove',e=>{
  const s=`left:${e.clientX}px;top:${e.clientY}px`;
  cur.style.cssText+=s; curR.style.cssText+=s;
  cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px';
  curR.style.left=e.clientX+'px'; curR.style.top=e.clientY+'px';
});

// ── toast ─────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── loading ───────────────────────────────────────────────
const lbar=document.getElementById('lbar'), lmsg=document.getElementById('lmsg');
const loadEl=document.getElementById('loading');
let loadHidden=false;
function setLoad(p,m){lbar.style.width=p+'%';if(m)lmsg.textContent=m;}
function hideLoad(){
  if(loadHidden)return; loadHidden=true;
  loadEl.classList.add('fade');
  setTimeout(()=>{ if(loadEl.parentNode) loadEl.remove(); },800);
}
// Safety fallback — always hide after 6s
setTimeout(hideLoad,6000);

// ── Three.js ──────────────────────────────────────────────
let scene,camera,renderer,controls;
let pGeo,pSys;
const COUNTS=[20000,40000,60000,80000];
let PARTICLE_COUNT=40000;
const MODELS=['tree','saturn','heart','sphere','torus','galaxy'];
let tPos={};
MODELS.forEach(m=>tPos[m]=new Float32Array(PARTICLE_COUNT*3));
let currentModel='tree';
let gScale=1,tgScale=1,tRotX=0,tRotY=0;
let autoRot=true, morphSpeed=0.075, pSize=0.34;
const BASE=1.75, SMIN=0.1, SMAX=2.4, PSMIN=0.11, PSMAX=0.28, PSONE=0.1547;

// uploaded 3D model particles
let customModels={}; // key -> Float32Array
let customModelList=[]; // [{id,name,icon}]

function mapP(ps){
  return ps<=PSONE
    ? THREE.MathUtils.mapLinear(ps,PSMIN,PSONE,SMIN,1)
    : THREE.MathUtils.mapLinear(ps,PSONE,PSMAX,1,SMAX);
}

function genPositions(){
  MODELS.forEach(m=>tPos[m]=new Float32Array(PARTICLE_COUNT*3));
  for(let i=0;i<PARTICLE_COUNT;i++){
    const i3=i*3;
    // TREE
    if(i<PARTICLE_COUNT*.08){
      const a=Math.random()*Math.PI*2,sw=Math.abs(Math.sin(a*5)),r=(1.8+sw*3)*Math.sqrt(Math.random());
      tPos.tree[i3]=r*Math.cos(a); tPos.tree[i3+1]=20+(Math.random()-.5)*1.5; tPos.tree[i3+2]=r*Math.sin(a)*.45;
    } else if(i<PARTICLE_COUNT*.92){
      const h=Math.random()*32-14,ln=(h+14)/32,lp=(ln*4)%1;
      let br=(1-ln)*18*Math.pow(lp,.42);
      const a=Math.random()*Math.PI*2,r=Math.max(0,br*Math.sqrt(Math.random())+(Math.random()-.5)*2.5);
      tPos.tree[i3]=Math.cos(a)*r; tPos.tree[i3+1]=h; tPos.tree[i3+2]=Math.sin(a)*r;
    } else {
      const h=Math.random()*5-19,r=Math.random()*2.2,a=Math.random()*Math.PI*2;
      tPos.tree[i3]=Math.cos(a)*r; tPos.tree[i3+1]=h; tPos.tree[i3+2]=Math.sin(a)*r;
    }
    // SATURN
    if(i<PARTICLE_COUNT*.42){
      const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),lf=.82+Math.random()*.06,r=11.5*Math.cbrt(Math.random());
      tPos.saturn[i3]=r*Math.sin(ph)*Math.cos(th); tPos.saturn[i3+1]=r*Math.sin(ph)*Math.sin(th)*lf; tPos.saturn[i3+2]=r*Math.cos(ph);
    } else {
      const v=Math.random(),rb=v<.22?14.5:v<.48?18.5:v<.72?23.5:28.5;
      const rr=rb+Math.random()*3.5+Math.sin(rb*1.7+i*.013)*.9,tr=Math.random()*Math.PI*2;
      const rip=Math.sin(tr*10+rr*.9)*.45+Math.sin(tr*23)*.18,tk=(Math.random()-.5)*(.45+Math.random()*.85);
      tPos.saturn[i3]=(rr+rip)*Math.cos(tr); tPos.saturn[i3+1]=tk; tPos.saturn[i3+2]=(rr+rip)*Math.sin(tr);
    }
    // HEART
    const t=Math.PI*2*Math.random(),u=Math.PI*(Math.random()-.5);
    tPos.heart[i3]=16*Math.pow(Math.sin(t),3)*1.35;
    tPos.heart[i3+1]=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*1.35;
    tPos.heart[i3+2]=6*Math.sin(u)*(1-Math.abs(Math.sin(t)))*1.35;
    // SPHERE
    const sth=Math.random()*Math.PI*2,sph=Math.acos(2*Math.random()-1),sr=18*Math.cbrt(Math.random())*(0.85+Math.random()*.3);
    const rips=Math.sin(sth*6+sph*4)*1.2;
    tPos.sphere[i3]=(sr+rips)*Math.sin(sph)*Math.cos(sth); tPos.sphere[i3+1]=(sr+rips)*Math.cos(sph); tPos.sphere[i3+2]=(sr+rips)*Math.sin(sph)*Math.sin(sth);
    // TORUS KNOT
    const kp=3,kq=2,tkt=(i/PARTICLE_COUNT)*Math.PI*2*kp;
    const tkr=Math.cos(kq*tkt/kp),outr=14+tkr*6,tbr=4+Math.random()*3,tba=Math.random()*Math.PI*2;
    const tx=outr*Math.cos(tkt/kp),tz2=outr*Math.sin(tkt/kp),ty=10*Math.sin(kq*tkt/kp);
    const nl=Math.sqrt(tx*tx+tz2*tz2)||1,nx=-tz2/nl,nz=tx/nl;
    tPos.torus[i3]=tx+nx*tbr*Math.cos(tba); tPos.torus[i3+1]=ty+tbr*Math.sin(tba)*.7; tPos.torus[i3+2]=tz2+nz*tbr*Math.cos(tba);
    // GALAXY
    const arms=4,arm=Math.floor(Math.random()*arms),gr=2+Math.pow(Math.random(),.6)*26;
    const ga=(arm/arms)*Math.PI*2+gr*.38+(Math.random()-.5)*(.55+(26-gr)/26*.9);
    const gy=(Math.random()-.5)*(1.2+Math.random()*1.8)*Math.exp(-gr/14);
    tPos.galaxy[i3]=Math.cos(ga)*gr; tPos.galaxy[i3+1]=gy; tPos.galaxy[i3+2]=Math.sin(ga)*gr;
  }
}

// Re-sample custom model positions to PARTICLE_COUNT
function resampleCustom(srcArr, n){
  const src=srcArr.length/3, out=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const s=Math.floor(Math.random()*src),s3=s*3,i3=i*3;
    // add slight scatter
    out[i3]=srcArr[s3]+(Math.random()-.5)*.4;
    out[i3+1]=srcArr[s3+1]+(Math.random()-.5)*.4;
    out[i3+2]=srcArr[s3+2]+(Math.random()-.5)*.4;
  }
  return out;
}

function extractPointsFromObject(obj,scale=1){
  const pts=[];
  obj.traverse(c=>{
    if(c.isMesh && c.geometry){
      const g=c.geometry.clone();
      if(!g.attributes.position) return;
      const pos=g.attributes.position;
      // apply world matrix
      c.updateWorldMatrix(true,false);
      for(let i=0;i<pos.count;i++){
        const v=new THREE.Vector3(pos.getX(i),pos.getY(i),pos.getZ(i));
        v.applyMatrix4(c.matrixWorld);
        pts.push(v.x*scale, v.y*scale, v.z*scale);
      }
    }
  });
  return new Float32Array(pts);
}

function normalizePoints(arr){
  // centre + scale to fit ~20 units
  let mx=0,my=0,mz=0,cx=0,cy=0,cz=0,n=arr.length/3;
  for(let i=0;i<n;i++){cx+=arr[i*3];cy+=arr[i*3+1];cz+=arr[i*3+2];}
  cx/=n;cy/=n;cz/=n;
  for(let i=0;i<n;i++){mx=Math.max(mx,Math.abs(arr[i*3]-cx));my=Math.max(my,Math.abs(arr[i*3+1]-cy));mz=Math.max(mz,Math.abs(arr[i*3+2]-cz));}
  const ms=Math.max(mx,my,mz)||1,scl=20/ms;
  const out=new Float32Array(arr.length);
  for(let i=0;i<n;i++){out[i*3]=(arr[i*3]-cx)*scl;out[i*3+1]=(arr[i*3+1]-cy)*scl;out[i*3+2]=(arr[i*3+2]-cz)*scl;}
  return out;
}

function initThree(){
  setLoad(20,'BUILDING SCENE...');
  const cont=document.getElementById('canvas-container');
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x050508,.011);
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
  camera.position.set(0,5,58);
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  cont.appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=.05;
  setLoad(50,'GENERATING PARTICLES...');
  genPositions();
  pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(tPos.tree),3));
  const mat=new THREE.PointsMaterial({size:pSize,color:new THREE.Color('#00ffcc'),transparent:true,opacity:.92,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  pSys=new THREE.Points(pGeo,mat);
  scene.add(pSys);
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  setLoad(75,'LOADING HAND AI...');
}

// ── FPS ───────────────────────────────────────────────────
let fps=0,fpsC=0,fpsT=performance.now();
function tickFPS(){
  fpsC++;
  const n=performance.now();
  if(n-fpsT>=1000){fps=fpsC;fpsC=0;fpsT=n;document.getElementById('fps').textContent=fps+' FPS';}
}

// ── Animate ───────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if(!pSys||!pGeo)return;
  tickFPS();
  gScale+=(tgScale-gScale)*.12;
  const aS=BASE*gScale;
  if(autoRot){
    pSys.rotation.y+=.0022;
  } else {
    pSys.rotation.y+=(tRotY-pSys.rotation.y)*.05;
    pSys.rotation.x+=(tRotX-pSys.rotation.x)*.05;
  }
  const pos=pGeo.attributes.position.array;
  // get target array
  let tArr=tPos[currentModel];
  if(!tArr) tArr=tPos.tree; // fallback
  for(let i=0;i<PARTICLE_COUNT;i++){
    const i3=i*3;
    pos[i3]+=(tArr[i3]*aS-pos[i3])*morphSpeed;
    pos[i3+1]+=(tArr[i3+1]*aS-pos[i3+1])*morphSpeed;
    pos[i3+2]+=(tArr[i3+2]*aS-pos[i3+2])*morphSpeed;
  }
  pGeo.attributes.position.needsUpdate=true;
  controls.update();
  renderer.render(scene,camera);
}

// ── 3D model file upload ──────────────────────────────────
function addCustomModel(name, pointsArr){
  const id='custom_'+Date.now();
  const normalized=normalizePoints(pointsArr);
  customModels[id]=resampleCustom(normalized, PARTICLE_COUNT);
  tPos[id]=customModels[id];
  customModelList.push({id,name});
  renderModelList();
  currentModel=id;
  updateActiveBtn(id);
  toast('✓ '+name+' loaded!');
}

function renderModelList(){
  const list=document.getElementById('model-list');
  list.innerHTML='';
  customModelList.forEach(({id,name})=>{
    const d=document.createElement('div');
    d.className='model-item'+(currentModel===id?' active':'');
    d.dataset.id=id;
    d.innerHTML=`<span class="mi-ico">📦</span><span class="mi-name">${name}</span><span class="mi-del" data-del="${id}">✕</span>`;
    d.addEventListener('click',e=>{
      const del=e.target.closest('[data-del]');
      if(del){
        const did=del.dataset.del;
        customModelList=customModelList.filter(m=>m.id!==did);
        delete customModels[did]; delete tPos[did];
        if(currentModel===did){currentModel='tree';updateActiveBtn('tree');}
        renderModelList(); return;
      }
      currentModel=id; updateActiveBtn(id);
    });
    list.appendChild(d);
  });
}

function updateActiveBtn(id){
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('active',b.dataset.model===id));
  document.querySelectorAll('.model-item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
}

function handleFileUpload(file){
  if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  const reader=new FileReader();
  toast('Loading '+file.name+'…');

  if(ext==='obj'){
    reader.onload=e=>{
      const loader=new THREE.OBJLoader();
      const obj=loader.parse(e.target.result);
      const pts=extractPointsFromObject(obj,1);
      if(pts.length<30){toast('⚠ No geometry found');return;}
      addCustomModel(file.name.replace('.obj',''), pts);
    };
    reader.readAsText(file);
  } else if(ext==='glb'||ext==='gltf'){
    reader.onload=e=>{
      const loader=new THREE.GLTFLoader();
      const data=e.target.result;
      loader.parse(data,'',gltf=>{
        const pts=extractPointsFromObject(gltf.scene,1);
        if(pts.length<30){toast('⚠ No geometry found');return;}
        addCustomModel(file.name.replace(/\.(glb|gltf)$/,''), pts);
      },err=>toast('⚠ Load error: '+err.message));
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('⚠ Unsupported format. Use GLB, GLTF, or OBJ');
  }
}

// ── UI ────────────────────────────────────────────────────
function setupUI(){
  // shape buttons
  document.getElementById('sgrid').addEventListener('click',e=>{
    const b=e.target.closest('.sbtn'); if(!b)return;
    currentModel=b.dataset.model;
    updateActiveBtn(currentModel);
  });

  // swatches
  document.getElementById('swatches').addEventListener('click',e=>{
    const sw=e.target.closest('.sw'); if(!sw)return;
    document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));
    sw.classList.add('on');
    applyColor(sw.dataset.c);
    document.getElementById('pcolor').value=sw.dataset.c;
  });

  document.getElementById('pcolor').addEventListener('input',e=>{
    applyColor(e.target.value);
    document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));
  });

  function applyColor(c){
    document.documentElement.style.setProperty('--accent',c);
    if(pSys) pSys.material.color.set(c);
  }

  // size
  const szEl=document.getElementById('sz'),szVal=document.getElementById('szval');
  szEl.addEventListener('input',e=>{
    pSize=parseFloat(e.target.value); szVal.textContent=pSize.toFixed(2);
    if(pSys) pSys.material.size=pSize;
  });

  // density
  const densEl=document.getElementById('dens'),densVal=document.getElementById('densval');
  const densLabels=['20k','40k','60k','80k'];
  densEl.addEventListener('change',e=>{
    const idx=parseInt(e.target.value)-1;
    densVal.textContent=densLabels[idx];
    PARTICLE_COUNT=COUNTS[idx];
    MODELS.forEach(m=>tPos[m]=new Float32Array(PARTICLE_COUNT*3));
    Object.keys(customModels).forEach(id=>{
      tPos[id]=resampleCustom(customModels[id].length>3?customModels[id]:new Float32Array(3),PARTICLE_COUNT);
    });
    genPositions();
    // Rebuild geometry
    pGeo.dispose();
    pGeo=new THREE.BufferGeometry();
    pGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(tPos[currentModel]||tPos.tree),3));
    pSys.geometry=pGeo;
    toast('Density: '+densLabels[idx]);
  });

  // morph speed
  const spEl=document.getElementById('sp'),spVal=document.getElementById('spval');
  spEl.addEventListener('input',e=>{morphSpeed=parseFloat(e.target.value);spVal.textContent=morphSpeed.toFixed(3);});

  // auto rotate
  const togRot=document.getElementById('tog-rot');
  togRot.addEventListener('click',()=>{autoRot=!autoRot;togRot.classList.toggle('on',autoRot);});

  // fog
  const togFog=document.getElementById('tog-fog');
  togFog.addEventListener('click',()=>{
    const on=togFog.classList.toggle('on');
    scene.fog=on?new THREE.FogExp2(0x050508,.011):null;
  });

  // fullscreen
  document.getElementById('btn-fs').addEventListener('click',()=>{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  // screenshot
  document.getElementById('btn-ss').addEventListener('click',()=>{
    renderer.render(scene,camera);
    const a=document.createElement('a');
    a.download='particle-universe-'+Date.now()+'.png';
    a.href=renderer.domElement.toDataURL('image/png');
    a.click(); toast('📷 Screenshot saved!');
  });

  // hide panel
  const panel=document.getElementById('panel'),btnP=document.getElementById('btn-panel');
  let panelVis=true;
  btnP.addEventListener('click',()=>{
    panelVis=!panelVis;
    panel.style.transform=panelVis?'':'translateX(-310px)';
    panel.style.transition='transform .35s ease';
    btnP.textContent=panelVis?'◀':'▶';
  });

  // file upload
  const uz=document.getElementById('upload-zone'),fi=document.getElementById('model-file');
  fi.addEventListener('change',e=>handleFileUpload(e.target.files[0]));
  uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag');});
  uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));
  uz.addEventListener('drop',e=>{
    e.preventDefault(); uz.classList.remove('drag');
    handleFileUpload(e.dataTransfer.files[0]);
  });
}

// ── MediaPipe ────────────────────────────────────────────
function initCam(){
  const video=document.getElementById('webcam');
  const st=document.getElementById('gstatus');

  if(!window.Hands||!window.Camera){
    st.textContent='AI library unavailable. Use mouse to rotate.';
    setLoad(100,'READY'); setTimeout(hideLoad,400);
    return;
  }

  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.5});

  let firstResult=false;
  hands.onResults(r=>{
    if(!firstResult){firstResult=true;setLoad(100,'ONLINE');setTimeout(hideLoad,300);}
    if(r.multiHandLandmarks&&r.multiHandLandmarks.length){
      st.classList.add('on');
      const h=r.multiHandLandmarks[0];
      const wr=h[0],mb=h[9],ip=h[5];
      const palmSize=Math.hypot(wr.x-mb.x,wr.y-mb.y)||.08;
      const cx=(wr.x+mb.x)*.5,cy=(wr.y+mb.y)*.5;
      const tips=[h[4],h[8],h[12],h[16],h[20]];
      const spread=tips.reduce((s,f)=>s+Math.hypot(f.x-cx,f.y-cy),0)/5;
      const openness=spread/palmSize;
      const thumbC=Math.hypot(h[4].x-cx,h[4].y-cy)<Math.hypot(h[3].x-cx,h[3].y-cy)*1.1;
      const curl=[[h[8],h[6]],[h[12],h[10]],[h[16],h[14]],[h[20],h[18]]].filter(([tip,pip])=>Math.hypot(tip.x-wr.x,tip.y-wr.y)<Math.hypot(pip.x-wr.x,pip.y-wr.y)*1.08).length;
      const fist=openness<1.72&&thumbC&&curl>=3;
      const hcx=(wr.x+mb.x+h[5].x+h[17].x)*.25;
      const hcy=(wr.y+mb.y+h[5].y+h[17].y)*.25;
      tRotY=-(hcx-.5)*Math.PI*1.8; tRotX=(hcy-.5)*Math.PI*1.1;
      if(fist){
        tgScale=THREE.MathUtils.clamp(mapP(palmSize),SMIN,SMAX);
        autoRot=false; document.getElementById('tog-rot').classList.remove('on');
      } else { tgScale=1; }
      st.innerHTML=`<strong>${fist?'✊ FIST':'✋ OPEN'}</strong> &nbsp;·&nbsp; Scale: ${tgScale.toFixed(2)}<br><span style="font-size:10px;color:var(--muted)">${fist?'Closer = bigger':'Move to rotate'}</span>`;
    } else {
      st.classList.remove('on');
      st.textContent='No hand detected. Show hand to camera.';
      tgScale=1;
    }
  });

  const cam=new Camera(video,{onFrame:async()=>await hands.send({image:video}),width:640,height:480});
  cam.start()
    .then(()=>{st.textContent='Camera active. Show hand to control.';setLoad(95,'CAMERA ON...');})
    .catch(e=>{
      setLoad(100,'CAM DENIED'); setTimeout(hideLoad,400);
      st.textContent='Camera denied — use mouse to rotate.';
    });
}

// ── Boot ─────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  setLoad(5,'STARTING...');
  initThree();
  setupUI();
  animate();
  initCam();
  // hide loading once particles are visible
  setTimeout(()=>{ setLoad(90,'ALMOST READY...'); },1000);
  setTimeout(()=>{ setLoad(100,'READY'); hideLoad(); },3000);
});
</script>
